# Configuration Foundry de CampusFund
# Documentation : https://book.getfoundry.sh/reference/config/

[profile.default]
src = "contracts"
test = "test"
script = "scripts/foundry"
out = "out"
libs = ["lib"]
solc = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# Le script de déploiement écrit les adresses dans deployments/ (lu par le front et le script IA)
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 100
fail_on_revert = false

[rpc_endpoints]
anvil = "http://127.0.0.1:8545"
sepolia = "${SEPOLIA_RPC_URL}"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}" }

[fmt]
line_length = 110

# Le lint de forge est lancé séparément (`forge lint`) lors de la phase d'audit, avec Slither.
[lint]
lint_on_build = false
